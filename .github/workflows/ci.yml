name: CI

# Every check CLAUDE.md section 10 requires, in one workflow. All of them must
# be green before merge -- that is what makes the architecture enforceable
# rather than aspirational.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Static checks. No database, so they start immediately and give the fastest
  # signal on the most common mistakes.
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (includes import boundaries)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prove the import boundaries still reject violations
        # A boundary rule nobody has watched reject anything is not a proven
        # boundary. This writes deliberate violations and asserts each is
        # caught, so an accidentally loosened config fails here rather than
        # letting the architecture erode unnoticed.
        run: pnpm verify:boundaries

      - name: Unit tests
        run: pnpm test

  # Database checks. These are the ones that prove the second enforcement layer
  # -- triggers, constraints, RLS -- actually holds (ARCHITECTURE.md 0.2).
  database:
    name: Migrations, RLS, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        # Applies every migration from scratch, so a migration that only works
        # against an already-populated database fails here.
        run: supabase start

      - name: Seed reference and demo data
        run: supabase db reset --local

      - name: Check generated types match the schema
        run: pnpm db:types:check

      - name: Check the permission matrix matches the RLS policies
        run: pnpm gen:rls-check

      - name: Database tests (schema guardrails, audit trail, RLS)
        run: pnpm test:db

      - name: Show Supabase logs on failure
        if: failure()
        run: supabase status || true

  # The 3 critical flows CLAUDE.md 8 names explicitly, driven through a real
  # browser against local Supabase -- proof the app actually works end to
  # end, not just that its pieces pass in isolation. Runs after `database`
  # rather than in parallel: no value in spinning up a second local Supabase
  # + browser just to fail faster on a migration that already failed there.
  e2e:
    name: E2E (Playwright)
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Seed reference and demo data
        run: supabase db reset --local

      - name: Export local Supabase credentials for the app and Playwright
        # `supabase status -o env` is the CLI's own documented way to get
        # these for CI -- not hardcoded, so a CLI version bump that changes
        # the local demo keys can't silently go stale here.
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show Supabase logs on failure
        if: failure()
        run: supabase status || true
